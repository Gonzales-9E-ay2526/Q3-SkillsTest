<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Q3 SkillsTest</title>

    <link rel="stylesheet" href="style.css">

    
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"rel="stylesheet">

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

</head>
<body>
    
    <br><br>
    <div class="container-fluid">

        <div class="header">
        <h1>📝 CINE SOPHIA TICKETS</h1>
        <hr>
        <h3>STUDENT DETAILS</h3>
        <label>Full Name:</label>
        <input type="text" class="form-control">
        
        <br>
        <h3>TICKET SELECTION</h3>
        <label>Quantity (₱250.00 Each)</label>
        <input type="number" class="form-control" min="0" value="0" id="qty">
        
        <br>
        <h3>PAYMENT DETAILS</h3>
        <label>Subtotal:</label>
            <input type="number" class="form-control" id="subtotal" readonly> <br>
       
        <label>Admin Fee ₱50.00</label>
        <input type="number" class="form-control" readonly><br>
        
        <label>Total:</label>
        <input type="text" class="form-control" id="total" readonly>
        <br><br><br>
            
        <button class="btn btn-primary me-2 BookNow" onclick="calculate()">Complete Registration</button>
        
        <button class="btn btn-primary" onclick="window.location.reload()">Reset</button>
    </div>
     
    
    <script src="main.js"></script>

</body>
</html>
